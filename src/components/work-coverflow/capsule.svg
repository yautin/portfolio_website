<g class="sled" opacity="0"><g transform="matrix(1,-.149,0,1,0,138)"><rect x="373" y="216" width="409" height="270" rx="21" fill="url(#rail-KEY)" stroke="#151a23" stroke-width="3"/><image href="/work-capsules/poster/capivasertib-tray.webp" x="399" y="245" width="369" height="216" clip-path="url(#face-KEY)" preserveAspectRatio="none"/><path d="M417 238 H762 M411 467 H764" fill="none" stroke="#89909b" stroke-opacity=".4" stroke-width="2"/><g class="tray-surface" clip-path="url(#face-KEY)" aria-hidden="true" pointer-events="none">
