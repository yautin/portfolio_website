 <rect class="tray-wash" x="399" y="245" width="369" height="216" rx="10" fill="url(#phosphor-KEY)" opacity="0"/>
 <g class="tray-mark" opacity="0"><use transform="translate(448 310) scale(1.14)"/></g>
</g>
