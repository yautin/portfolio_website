   <ellipse cx="928" cy="321" rx="207" ry="207" fill="url(#lamp-KEY)"/>
   <use href="#inner-catch-KEY" stroke="#2caeff" stroke-width="34" opacity=".84" style="filter:blur(10px)"/>
   <use href="#inner-catch-KEY" stroke="#9dedff" stroke-width="7" opacity=".78" style="filter:blur(1.7px)"/>
  </g>
  <!-- A tight occlusion shadow separates the silver bonds from the lit glass behind them. -->
  <g class="specimen-float"><image class="specimen" x="800" y="217" width="251" height="251" style="filter:drop-shadow(0 2px 2px #10202f) drop-shadow(0 0 1.5px #112b3c)"/></g>
 </g>
</g>

<image class="shell" href="/work-capsules/poster/body.webp" x="70" y="76" width="695" height="579"/>
<!-- Trace of the existing cyan inset on the stationary metal, in the shell camera coordinates. -->
<g class="strip-glow" opacity="0" pointer-events="none" fill="none" stroke-linecap="round">
 <defs><path id="trace-KEY" d="M282 182C241 190 204 215 178 241C169 251 172 263 161 279C143 306 135 326 126 346C121 356 109 360 107 377C102 399 101 434 103 453C104 473 108 489 111 502"/><linearGradient id="strip-ink-KEY" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#adf4ff" stop-opacity="0"/><stop offset=".13" stop-color="#a9f2ff"/><stop offset=".70" stop-color="#b9f7ff"/><stop offset="1" stop-color="#96eaff" stop-opacity="0"/></linearGradient></defs>
 <!-- Broad blue spill on the metal, narrow blue tube, then the white-hot filament. -->
 <use href="#trace-KEY" stroke="#25bcff" stroke-width="42" opacity=".85" style="filter:blur(10px)"/>
 <use href="#trace-KEY" stroke="#37d9ff" stroke-width="22" style="filter:blur(3px)"/>
 <use href="#trace-KEY" stroke="url(#strip-ink-KEY)" stroke-width="10"/>
 <use href="#trace-KEY" stroke="#efffff" stroke-width="4.5"/>
</g>
<g class="monitor" pointer-events="none">
 <defs><linearGradient id="screen-KEY" x1="0" y1="0" x2=".45" y2="1"><stop stop-color="#1e2731"/><stop offset=".48" stop-color="#151c24"/><stop offset="1" stop-color="#0e151c"/></linearGradient></defs>
 <!-- Trace the inner face, leaving the bevel and the fixed ice-blue case strip in the source art. -->
 <path d="M370 305 L654 262 Q691 255 691 291 L691 486 Q691 514 664 523 L374 572 C305 582 251 537 249 465 C246 386 293 318 370 305Z" fill="url(#screen-KEY)" fill-opacity=".94" stroke="#404957" stroke-opacity=".48" stroke-width="1.5"/>
 <g transform="matrix(1,-.15,0,1,332,453)">
