<g class="socket" opacity="0"><path d="M647 109 Q750 108 763 273 L762 470 Q765 553 700 583 L679 580 Q729 480 725 367 Q735 181 647 109Z" fill="url(#side-KEY)"/><path d="M673 124 Q753 142 755 292 L755 469 Q753 536 715 563 Q747 475 741 374 Q752 187 673 124Z" fill="#121a26"/></g>
