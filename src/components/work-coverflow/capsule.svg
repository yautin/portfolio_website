<!-- Texture, chamber light and specimen travel with the right cap; only the specimen floats. -->
<g class="cap-assembly" pointer-events="none">
 <image class="glass" href="/work-capsules/poster/glass.webp" x="638" y="76" width="502" height="521"/>
 <defs>
  <clipPath id="lumen-KEY"><path d="M775 224Q770 165 738 133L891 107C1000 88 1096 169 1110 275C1135 416 1058 505 958 526L766 552Q783 515 782 455Z"/></clipPath>
  <radialGradient id="lamp-KEY" cx="54%" cy="61%" r="62%"><stop stop-color="#bdf5ff" stop-opacity=".94"/><stop offset=".27" stop-color="#70d7ff" stop-opacity=".86"/><stop offset=".68" stop-color="#319cf1" stop-opacity=".55"/><stop offset="1" stop-color="#297ed9" stop-opacity="0"/></radialGradient>
  <path id="inner-catch-KEY" d="M795 499 C851 509 933 503 993 469 Q1048 440 1070 386"/>
 </defs>
 <g clip-path="url(#lumen-KEY)">
