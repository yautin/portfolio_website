[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# No filesystem access. Scripts and tests here read nothing from disk, and a
# blanket `{ access = "read", path = "./" }` would let any script (or any future
# dependency's script) `vm.readFile("./.env")` and exfiltrate the deployer key.
# Secrets come from the environment via vm.envUint/vm.envAddress only.
fs_permissions = []

# Named RPC endpoints resolved from the environment at run time.
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_MAINNET_RPC_URL}"

# Contract verification on BaseScan (needs a free API key).
[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }
base = { key = "${BASESCAN_API_KEY}", chain = 8453, url = "https://api.basescan.org/api" }
