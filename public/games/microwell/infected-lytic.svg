<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <!-- lysing host cell: ruptured membrane (open at right), cytoplasm spilling out -->
  <path d="M20 7 C28 6 33 12 33 21 C33 30 28 37 19 37 C11 37 6 30 6 21 C6 12 12 8 20 7 Z"
        fill="#431325" fill-opacity="0.92" />
  <!-- torn membrane arc, broken on the right -->
  <path d="M30 8 A16 16 0 1 0 30 36" stroke="#f25f5c" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- jagged rupture edges -->
  <path d="M30 8 l4 -2 l-2 4 l4 0" stroke="#f25f5c" stroke-width="1.6" fill="none" stroke-linejoin="round" />
  <path d="M30 36 l4 2 l-2 -4 l4 0" stroke="#f25f5c" stroke-width="1.6" fill="none" stroke-linejoin="round" />
  <!-- spilling cytoplasm + released particles -->
  <g fill="#ff8f8c">
    <circle cx="34" cy="22" r="2.6" />
    <circle cx="38.5" cy="19.5" r="1.9" />
    <circle cx="41" cy="24" r="1.3" />
    <circle cx="37.5" cy="27.5" r="1.6" />
  </g>
  <circle cx="15" cy="20" r="4.5" fill="#7a2f45" stroke="#e0899a" stroke-width="1.3" />
</svg>
