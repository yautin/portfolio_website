<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="rim" x1="12" y1="14" x2="84" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4cc9f0" />
      <stop offset="1" stop-color="#9d4edd" />
    </linearGradient>
    <radialGradient id="gc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4cc9f0" stop-opacity="0.95" /><stop offset="1" stop-color="#4cc9f0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gt" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#52d1a4" stop-opacity="0.9" /><stop offset="1" stop-color="#52d1a4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gv" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c58bff" stop-opacity="0.9" /><stop offset="1" stop-color="#9d4edd" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- chip body -->
  <rect x="9" y="15" width="78" height="66" rx="11" fill="#0f1116" fill-opacity="0.7" stroke="url(#rim)" stroke-width="3" />
  <rect x="14" y="20" width="68" height="56" rx="8" fill="none" stroke="#9d4edd" stroke-opacity="0.24" stroke-width="1.2" />

  <!-- microfluidic channels linking the wells -->
  <g stroke="#4cc9f0" stroke-opacity="0.18" stroke-width="1.4">
    <line x1="26" y1="34" x2="70" y2="34" /><line x1="26" y1="48" x2="70" y2="48" /><line x1="26" y1="62" x2="70" y2="62" />
    <line x1="26" y1="34" x2="26" y2="62" /><line x1="42" y1="34" x2="42" y2="62" />
    <line x1="58" y1="34" x2="58" y2="62" /><line x1="70" y1="34" x2="70" y2="62" />
  </g>

  <!-- inlet / outlet ports -->
  <g stroke="#9d4edd" stroke-opacity="0.5" stroke-width="1.6">
    <line x1="5" y1="48" x2="14" y2="48" /><line x1="82" y1="34" x2="91" y2="34" />
  </g>
  <circle cx="5" cy="48" r="2.2" fill="#9d4edd" /><circle cx="91" cy="34" r="2.2" fill="#4cc9f0" />

  <!-- empty wells -->
  <g fill="#0f1116" stroke="#4cc9f0" stroke-opacity="0.3" stroke-width="1">
    <circle cx="58" cy="34" r="3.6" /><circle cx="70" cy="34" r="3.6" />
    <circle cx="26" cy="48" r="3.6" /><circle cx="42" cy="48" r="3.6" />
    <circle cx="26" cy="62" r="3.6" /><circle cx="58" cy="62" r="3.6" /><circle cx="70" cy="62" r="3.6" />
  </g>

  <!-- live-cell wells: viability glow + nucleus -->
  <circle cx="26" cy="34" r="9" fill="url(#gc)" /><circle cx="26" cy="34" r="2.6" fill="#bfeeff" />
  <circle cx="58" cy="48" r="9" fill="url(#gt)" /><circle cx="58" cy="48" r="2.6" fill="#d6f7ea" />
  <circle cx="42" cy="62" r="9" fill="url(#gv)" /><circle cx="42" cy="62" r="2.6" fill="#efe0ff" />

  <!-- viral-load count on a well -->
  <text x="42" y="38" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#4cc9f0" text-anchor="middle">2</text>

  <!-- antibody flag tagging an infected trap -->
  <g stroke-linecap="round" stroke-linejoin="round" transform="translate(70 49) scale(0.5)">
    <path d="M0 1 L0 13" stroke="#4cc9f0" stroke-width="5.5" />
    <path d="M0 2 L-10 -13" stroke="#4cc9f0" stroke-width="5.5" />
    <path d="M0 2 L10 -13" stroke="#4cc9f0" stroke-width="5.5" />
    <circle cx="0" cy="2" r="4" fill="#bff0ff" />
    <circle cx="-10.5" cy="-13.5" r="3.6" fill="#bff0ff" />
    <circle cx="10.5" cy="-13.5" r="3.6" fill="#bff0ff" />
  </g>

  <!-- glassy highlight -->
  <path d="M16 27 Q19 21 29 20" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2" fill="none" stroke-linecap="round" />
</svg>
